<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B2545">
<title>Sem ligação — CHP-Angola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --primary: #0B2545; --gold: #C5A059; --gold-light: #D4B87A; --text: #E2E8F0; --text-muted: #94A3B8; }
html, body { height: 100%; }
body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--primary); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; position: relative;
}
body::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 30%, rgba(197, 160, 89, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 70%, rgba(19, 51, 92, 0.6) 0%, transparent 60%);
    pointer-events: none;
}
.offline-container { max-width: 460px; width: 100%; text-align: center; position: relative; z-index: 2; animation: fadeInUp 0.6s ease; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.offline-icon { width: 140px; height: 140px; margin: 0 auto 32px; position: relative; }
.offline-icon svg { width: 100%; height: 100%; animation: pulseGlow 2.4s ease-in-out infinite; }
@keyframes pulseGlow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(197, 160, 89, 0.4)); transform: scale(1); } 50% { filter: drop-shadow(0 0 35px rgba(197, 160, 89, 0.6)); transform: scale(1.04); } }
.orbit { position: absolute; inset: -10px; border: 1px dashed rgba(197, 160, 89, 0.3); border-radius: 50%; animation: rotate 20s linear infinite; }
.orbit::after { content: ''; position: absolute; top: 0; left: 50%; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 12px var(--gold); transform: translateX(-50%); }
@keyframes rotate { to { transform: rotate(360deg); } }
h1 { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 800; color: white; margin-bottom: 12px; letter-spacing: -0.5px; line-height: 1.2; }
h1 .accent { font-style: italic; background: linear-gradient(135deg, #C5A059, #E8CE8F); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 36px; max-width: 380px; margin-left: auto; margin-right: auto; }
.status-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(197, 160, 89, 0.12); border: 1px solid rgba(197, 160, 89, 0.3); padding: 8px 18px; border-radius: 50px; font-size: 12px; color: var(--gold-light); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; margin-bottom: 32px; }
.status-dot { width: 8px; height: 8px; background: #EF4444; border-radius: 50%; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }
.actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 36px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 28px; border-radius: 50px; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; border: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-family: inherit; letter-spacing: 0.3px; }
.btn svg { width: 20px; height: 20px; }
.btn-primary { background: linear-gradient(135deg, #C5A059, #D4B87A); color: var(--primary); box-shadow: 0 10px 30px -8px rgba(197, 160, 89, 0.5); }
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -10px rgba(197, 160, 89, 0.7); }
.btn-outline { background: transparent; color: white; border: 2px solid rgba(255, 255, 255, 0.2); }
.btn-outline:hover { background: white; color: var(--primary); border-color: white; transform: translateY(-3px); }
.info { font-size: 13px; color: var(--text-muted); line-height: 1.7; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
.info strong { color: var(--gold); display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.info a { color: var(--gold); text-decoration: none; font-weight: 600; border-bottom: 1px dotted var(--gold); }
@media (max-width: 500px) { .offline-icon { width: 110px; height: 110px; } h1 { font-size: 26px; } }
</style>
</head>
<body>

<div class="offline-container">
    <div class="offline-icon">
        <div class="orbit"></div>
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 10 L100 28 L100 60 C100 90 60 110 60 110 C60 110 20 90 20 60 L20 28 Z" fill="#061529" stroke="#C5A059" stroke-width="2"/>

            <path d="M46 63 Q60 54 74 63" stroke="#C5A059" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
            <circle cx="60" cy="75" r="3" fill="#C5A059"/>
            <line x1="35" y1="85" x2="85" y2="35" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
    </div>
    <div class="status-badge">
        <span class="status-dot"></span>
        Sem ligação à internet

                <polyline points="23 4 23 10 17 10"/>

            </svg>
            Tentar novamente
        </button>
        <a href="https://wa.me/244929202707" class="btn btn-outline" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                <path d="M20.52 3.449C12.831-3.984.106 1.407.101 11.893c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652a11.9 11.9 0 0 0 5.71 1.457h.005c9.89 0 15.99-11.96 9.47-18.356z"/>
            </svg>
            Falar por WhatsApp
        </a>
    </div>
    <div class="info">
        <strong>Contacto direto</strong>
        📱 <a href="tel:+244929202707">+244 929 202 707</a><br>
        ✉️ <a href="mailto:geral@chp-angola.com">geral@chp-angola.com</a>
    </div>
</div>

<script>
let wasOffline = !navigator.onLine;
window.addEventListener('online', () => {
    if (wasOffline) {
        document.querySelector('.status-badge').innerHTML = '<span class="status-dot" style="background:#10B981"></span> Ligação restaurada';
        setTimeout(() => window.location.replace('./'), 800);
    }
});
window.addEventListener('offline', () => { wasOffline = true; });
</script>

</body>
</html>
